[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tlefinder-core"
version = "0.1.0"
description = "Reusable TLE Finder satellite-pass search engine."
authors = ["TLE Finder contributors"]
readme = "README.md"
packages = [{ include = "tlefinder", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
httpx = ">=0.27,<1.0"
numpy = ">=1.26,<3.0"
skyfield = ">=1.53,<2.0"
tzdata = ">=2026.2,<2027.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<8.0"

[tool.poetry.scripts]
tlefinder-benchmark-core = "tlefinder.benchmarks.core_search:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast tests for isolated Core behavior",
    "functional: tests for Core packaging and complete workflows",
]

[tool.coverage.run]
branch = true
source = ["tlefinder.core", "tlefinder.benchmarks"]

[tool.coverage.report]
fail_under = 80.21
precision = 2
show_missing = true
skip_covered = true
