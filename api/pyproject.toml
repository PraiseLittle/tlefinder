[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tlefinder-api"
version = "0.1.0"
description = "HTTP API for the TLE Finder Core search engine."
authors = ["TLE Finder contributors"]
readme = "README.md"
packages = [{ include = "tlefinder", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
tlefinder-core = { path = "../core", develop = true }
fastapi = ">=0.115,<1.0"
pydantic = ">=2.0,<3.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
pyyaml = ">=6.0,<7.0"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27,<1.0"
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<8.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast tests for isolated API behavior",
    "functional: tests for the API consumer contract and HTTP workflows",
]

[tool.coverage.run]
branch = true
source = ["tlefinder.api"]

[tool.coverage.report]
fail_under = 93.58
precision = 2
show_missing = true
skip_covered = true
