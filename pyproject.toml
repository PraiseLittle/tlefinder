[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tlefinder"
version = "0.1.0"
description = "Core TLE Finder search engine."
authors = [{ name = "TLE Finder contributors" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "skyfield>=1.53,<2.0",
    "tzdata (>=2026.2,<2027.0)",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pyyaml>=6.0,<7.0",
]

[tool.poetry]
packages = [{ include = "tlefinder", from = "src" }]

[tool.poetry.group.dev.dependencies]
freezegun = ">=1.5,<2.0"
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<8.0"
respx = ">=0.21,<1.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast tests for isolated core modules",
    "functional: tests that exercise the full core search workflow",
]

[tool.coverage.run]
branch = true
source = ["tlefinder"]

[tool.coverage.report]
show_missing = true
skip_covered = true
